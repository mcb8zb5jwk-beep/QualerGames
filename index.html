<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1a38">
<title>QuälerGames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:,">
<script>
/* Schriften nicht-blockierend nachladen (kein Render-Block durch Google Fonts) */
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Inter:wght@500..800&family=Lilita+One&family=Barlow:ital,wght@1,900&display=swap';document.head.appendChild(l)})();
</script>
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500..800&family=Lilita+One&family=Barlow:ital,wght@1,900&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="topbg" aria-hidden="true"></div>
    <h1 class="brand">QuälerGames</h1>
    <div class="tools">
      <button class="tbtn" data-act="search" aria-label="Spiele suchen" id="iSearch"></button>
    </div>
  </header>

  <main>
    <section class="hero" id="hero" aria-roledescription="Karussell" aria-label="Spiele im Fokus">
      <div class="slides" id="slides"></div>
      <div class="dots" id="dots"></div>
    </section>

    <div class="below">
    <section class="row" aria-labelledby="h1">
      <h2 class="rh" id="h1"><span id="hRecent"></span></h2>
      <div class="grid2" id="rowRecent"></div>
    </section>

    <section class="row" id="secSoon" style="margin-top:26px" aria-labelledby="h2">
      <h2 class="rh" id="h2">Demnächst</h2>
      <div class="cards" id="rowSoon"></div>
    </section>
    <div class="spacer"></div>
    </div>
  </main>

</div>

<div class="game" id="game" inert aria-hidden="true" role="dialog" aria-modal="true" aria-label="Impostor">
  <div class="gbar gfloat">
    <button class="round" data-act="gback" aria-label="Zurück" id="iBack"></button>
    <div class="gtitle" id="gTitle">Impostor</div>
    <button class="round" data-act="howto" aria-label="So wird gespielt">?</button>
  </div>
  <div class="gbody" id="gBody"></div>
  <div class="gfoot" id="gFoot"></div>
</div>

<div class="search" id="search" inert aria-hidden="true" role="dialog" aria-modal="true" aria-label="Spiele suchen">
  <div class="sinner">
    <div class="gbar">
      <button class="round" data-act="qback" aria-label="Zurück" id="iQBack"></button>
      <div class="gtitle">Spiele suchen</div>
      <button class="round" data-act="settings" aria-label="Einstellungen" id="iSettings"></button>
    </div>
    <div class="qbody">
      <div class="sbox"><span id="iSbox" style="display:contents"></span><input id="sq" type="search" placeholder="Spiel suchen" autocomplete="off" aria-label="Spiel suchen"></div>
      <div id="sres"></div>
    </div>
  </div>
</div>

<div class="settings" id="settings" inert aria-hidden="true" role="dialog" aria-modal="true" aria-label="Einstellungen">
  <div class="sinner">
    <div class="gbar">
      <button class="round" data-act="sback" aria-label="Zurück" id="iSBack"></button>
      <div class="gtitle">Einstellungen</div>
      <span class="round" aria-hidden="true" style="visibility:hidden"></span>
    </div>
    <div class="sbody" id="sBody"></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
