const C={phase:'setup',players:['','',''],k:1,idx:0,q:null,imp:new Set(),vals:[],picks:new Set(),score:[],used:[],ok:false,round:0,def:0};
const cSaved=store.get('splash.circa',null);
if(cSaved){
  const isDef=p=>typeof p!=='string'||!p.trim()||/^Spieler \d+$/.test(p.trim());
  if(Array.isArray(cSaved.players)&&cSaved.players.length>=3&&!cSaved.players.every(isDef))C.players=cSaved.players.slice(0,12).map(x=>isDef(x)?'':x.slice(0,14));
  if([1,2,3].includes(+cSaved.k))C.k=+cSaved.k;
}
const cSave=()=>store.set('splash.circa',{players:C.players,k:C.k});
const cMaxK=()=>Math.max(1,Math.min(3,Math.floor((C.players.length-1)/2)));
const fmtN=n=>Number(n).toLocaleString('de-DE');
function cRender(){setLayout(C.phase==='setup');({setup:cSetup,pass:cPass,reveal:cReveal,vote:cVote,result:cResult})[C.phase]();gBody.scrollTop=0;if(isSetup())kickPaint()}

function cSetup(){
  gTitle.textContent='Circa Impostor';
  const n=C.players.length,mk=cMaxK();if(C.k>mk)C.k=mk;
  const pad=`
  <h3 class="sec">Spieler <small>${n} dabei</small></h3>
  <div class="plist">${C.players.map((p,i)=>`<div class="pf"><i class="pc" style="background:${PC[i%PC.length]}">${i+1}</i><input type="text" data-c="1" data-i="${i}" value="${esc(p)}" placeholder="Spieler ${i+1}" maxlength="14" aria-label="Name von Spieler ${i+1}" autocomplete="off" enterkeyhint="done">${n>3?`<button class="x" data-act="crm" data-i="${i}" aria-label="Spieler ${i+1} entfernen">×</button>`:''}</div>`).join('')}</div>
  ${n<12?'<button class="ghost" data-act="cadd">+ Spieler hinzufügen</button>':''}
  <h3 class="sec">Anzahl Impostor</h3>
  <div class="seg" role="group" aria-label="Anzahl Impostor">${[1,2,3].filter(v=>v<=mk).map(v=>`<button data-act="ck" data-v="${v}" aria-pressed="${C.k===v}">${v}</button>`).join('')}</div>
  <p class="fnote" style="margin-top:14px">Der Impostor bekommt eine andere Frage – und merkt selbst nicht, dass er der Impostor ist.</p>`;
  setShell('circa',pad);
  gFoot.innerHTML=`<button class="cta" data-act="cstart">${I.play}<span>Spielen</span></button>`;
}
function cStart(fresh){
  C.players=C.players.map((p,i)=>(p||'').trim()||('Spieler '+(i+1)));
  if(C.k>cMaxK())C.k=cMaxK();
  cSave();
  if(fresh||C.score.length!==C.players.length){C.score=C.players.map(()=>0);C.round=0}
  C.round++;
  let pool=CQ.filter(q=>!C.used.includes(q.a));
  if(!pool.length){pool=CQ;C.used=[]}
  C.q=pick(pool);C.used.push(C.q.a);
  const n=C.players.length;
  C.imp=new Set(shuffle(Array.from({length:n},(_,i)=>i)).slice(0,C.k));
  C.def=Math.round((C.q.min+C.q.max)/2/C.q.step)*C.q.step;
  C.vals=C.players.map(()=>C.def);
  C.picks=new Set();C.idx=0;C.phase='pass';cRender();
}
function cPass(){
  gTitle.textContent='Circa Impostor';
  const n=C.players.length,i=C.idx,q=C.q,txt=C.imp.has(i)?q.b:q.a,v=C.vals[i];
  gBody.innerHTML=`<div class="pass"><div class="prog" aria-hidden="true">${C.players.map((_,j)=>`<i class="${j<i?'done':j===i?'now':''}"></i>`).join('')}</div>
    <p class="dim">Gib das Handy an</p><h2 class="who">${esc(C.players[i])}</h2>
    <button class="flip q" id="flip" data-act="flip" aria-pressed="false" aria-label="Karte aufdecken oder verdecken"><span class="inner">
      <span class="face back"><span class="mm qmark" aria-hidden="true">?</span><b>Tippe zum Aufdecken</b></span>
      <span class="face front"><small>Deine Frage</small><strong class="qq">${esc(txt)}</strong></span></span></button>
    <div class="slid" id="slid" hidden style="--p:${(100*(v-q.min)/(q.max-q.min)).toFixed(2)}%">
      <div class="sval" id="sval">${fmtN(v)}</div>
      <input class="srng" id="srng" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${v}" data-act="cslide" aria-label="Deine Schätzung">
      <div class="srow"><span>${fmtN(q.min)}</span><span>${fmtN(q.max)}</span></div>
    </div>
    <p class="dim small">Nur du darfst die Karte sehen.</p></div>`;
  gFoot.innerHTML=`<button class="cta" id="nextBtn" data-act="cnext" disabled><span>${i<n-1?'Schätzung abgeben':'Alle fertig'}</span></button>`;
}
function cNext(){
  const r=$('#srng');
  if(r)C.vals[C.idx]=+r.value;
  if(C.idx<C.players.length-1){C.idx++;cRender()}
  else{C.phase='reveal';cRender()}
}
function cRow(i,cls){
  return `<div class="rrow ${cls||''}"><i class="pc" style="background:${PC[i%PC.length]}">${i+1}</i><span class="nm">${esc(C.players[i])}</span><span class="tm"><b class="est">${fmtN(C.vals[i])}</b></span></div>`;
}
function cReveal(){
  gTitle.textContent='Circa Impostor';
  const rows=C.players.map((_,i)=>i).sort((a,b)=>C.vals[a]-C.vals[b]);
  gBody.innerHTML=`<div class="res"><h2 class="who sm">Das habt ihr geschätzt</h2>
    <p class="dim c" style="margin-bottom:16px">${C.k===1?'Eine Zahl gehört zu einer anderen Frage.':'Ein paar Zahlen gehören zu einer anderen Frage.'} Redet drüber.</p>
    ${rows.map(i=>cRow(i)).join('')}</div>`;
  gFoot.innerHTML=`<button class="cta" data-act="ctovote">Abstimmen</button>`;
}
function cVote(){
  gTitle.textContent='Circa Impostor';
  const rows=C.players.map((_,i)=>i).sort((a,b)=>C.vals[a]-C.vals[b]);
  gBody.innerHTML=`<div class="vote"><h2 class="who sm">Wer ist der Impostor?</h2><p class="dim c">Einigt euch auf ${C.k===1?'eine Person':C.k+' Personen'}.</p>
    <div class="plist v">${rows.map(i=>`<button class="pick" data-act="cpick" data-i="${i}" aria-pressed="${C.picks.has(i)}"><i class="pc" style="background:${PC[i%PC.length]}">${i+1}</i><span>${esc(C.players[i])}</span><b class="tmv">${fmtN(C.vals[i])}</b><em class="ck">${I.check}</em></button>`).join('')}</div></div>`;
  gFoot.innerHTML=`<button class="cta" data-act="cresolve" ${C.picks.size===C.k?'':'disabled'}><span>Auflösen</span></button>`;
}
function cResolve(){
  const ok=C.picks.size===C.imp.size&&[...C.imp].every(i=>C.picks.has(i));
  C.ok=ok;
  C.players.forEach((_,i)=>{if(C.imp.has(i)){if(!ok)C.score[i]+=2}else if(ok)C.score[i]+=1});
  if(ok){sfx.success();haptic([15,60,15,60,15])}else{sfx.fail();haptic([40,30,80])}
  C.phase='result';cRender();
}
function cResult(){
  gTitle.textContent='Circa Impostor';
  const ok=C.ok,plural=C.imp.size>1,q=C.q;
  const chip=(i,cls)=>`<span class="rchip ${cls||''}"><i class="pc" style="background:${PC[i%PC.length]}">${i+1}</i>${esc(C.players[i])}</span>`;
  const rows=C.players.map((_,i)=>i).sort((a,b)=>C.vals[a]-C.vals[b]);
  const board=C.score.map((s,i)=>({i,s})).sort((x,y)=>y.s-x.s);
  gBody.innerHTML=`<div class="res"><h2 class="logo">${ttl(ok?'Crew':'Impostor',ok?'l2':'l2 bad')}${ttl('gewinnt!','l3')}</h2>
    <div class="qcard"><p class="lbl">Frage der Crew</p><p class="txt">${esc(q.a)}</p></div>
    <div class="qcard"><p class="lbl">${plural?'Frage der Impostor':'Frage des Impostors'}</p><p class="txt">${esc(q.b)}</p></div>
    <div class="rcard"><p class="lbl">${plural?'Die Impostor waren':'Der Impostor war'}</p><div class="rchips">${[...C.imp].map(i=>chip(i,'bad')).join('')}</div></div>
    <div class="rcard"><p class="lbl">Euer Tipp</p><div class="rchips">${[...C.picks].map(i=>chip(i,C.imp.has(i)?'good':'bad')).join('')}</div></div>
    ${rows.map(i=>cRow(i,C.imp.has(i)?'imp':'')).join('')}
    ${C.round>1?`<div class="rcard" style="margin-top:16px"><p class="lbl">Punkte nach ${C.round} Runden</p><div class="rchips">${board.map(r=>`<span class="rchip"><i class="pc" style="background:${PC[r.i%PC.length]}">${r.i+1}</i>${esc(C.players[r.i])}<span class="pts">${r.s}</span></span>`).join('')}</div></div>`:''}</div>`;
  gFoot.innerHTML=`<div class="frow"><button class="round big" data-act="cedit" aria-label="Spieler ändern" title="Spieler ändern">${I.back}</button><button class="cta" data-act="cagain"><span>Nochmal spielen</span></button></div>`;
}
function cBack(){
  if(C.phase==='setup'){sfx.close();closeGame()}
  else if(C.phase==='result'){sfx.close();C.phase='setup';cRender()}
  else{sfx.warn();confirmQuit()}
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.matches('input'))return;
  const a=t.dataset.act;
  if(t.getAttribute('aria-disabled')==='true'&&a!=='soon')return;
  switch(a){
    case 'play':sfx.launch();haptic(10);openGame(t.dataset.g,t);break;
    case 'srPlay':sfx.launch();haptic(10);closeSearch(true);openGame(t.dataset.g);break;
    case 'howto':sfx.open();haptic(10);howTo();break;
    case 'soon':break;
    case 'search':sfx.open();haptic(10);openSearch();break;
    case 'qback':sfx.close();haptic(8);closeSearch();break;
    case 'profile':sfx.open();haptic(10);openProfile();break;
    case 'profileDone':sfx.tap();haptic(10);if(profile.name&&!G.players[0])G.players[0]=profile.name;closeModal();break;
    case 'closeModal':sfx.close();haptic(8);closeModal();break;
    case 'dot':haptic(6);setActive(+t.dataset.i);break;
    case 'settings':sfx.open();haptic(10);openSettings();break;
    case 'sback':sfx.close();haptic(8);closeSettings();break;
    case 'gback':haptic(10);if(cur==='buzzer'){bBack();break}if(cur==='bombe'){zBack();break}if(cur==='chooser'){wBack();break}if(cur==='circa'){cBack();break}if(G.phase==='setup'){sfx.close();closeGame()}else if(G.phase==='result'){sfx.close();G.phase='setup';render()}else{sfx.warn();confirmQuit()}break;
    case 'quit':sfx.warn();haptic([10,20,10]);closeModal();if(cur==='buzzer'){B.phase='setup';bRender()}else if(cur==='bombe'){Z.phase='setup';zRender()}else if(cur==='chooser'){W.phase='setup';wRender()}else if(cur==='circa'){C.phase='setup';cRender()}else{G.phase='setup';render()}break;
    case 'add':if(G.players.length>=12)break;sfx.tap();haptic(8);G.players.push('');rSetup();{const ins=$$('.pf input');ins[ins.length-1].focus()}break;
    case 'rm':sfx.tap();haptic(8);G.players.splice(+t.dataset.i,1);save();rSetup();break;
    case 'cat':{sfx.toggle();haptic(8);const k=t.dataset.k,on=G.cats.includes(k);G.cats=on?G.cats.filter(x=>x!==k):G.cats.concat(k);syncCats();break}
    case 'catall':sfx.toggle();haptic(8);G.cats=G.cats.length===Object.keys(CATS).length?[]:Object.keys(CATS);syncCats();break;
    case 'ddcat':sfx.tap();haptic(8);ddOpen=!ddOpen;syncDD();break;
    case 'k':sfx.toggle();haptic(8);G.k=+t.dataset.v;$$('[data-act="k"]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));save();break;
    case 'time':sfx.toggle();haptic(8);G.time=+t.dataset.v;$$('[data-act="time"]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));save();break;
    case 'start':ddOpen=false;sfx.start();haptic([15,40,15]);start(true);break;
    case 'flip':{const f=$('#flip');setFlip(!f.classList.contains('rev'));break}
    case 'next':
      sfx.tap();haptic(10);
      if(G.idx<G.players.length-1){G.idx++;render()}
      else{G.phase='discuss';G.remaining=G.time*60;G.paused=false;render()}
      break;
    case 'pause':sfx.tap();haptic(10);G.paused=!G.paused;if(G.paused)G.left=Math.max(0,G.endAt-performance.now());else G.endAt=performance.now()+G.left;{const b=$('#pauseBtn');b.innerHTML=G.paused?I.resume:I.pause;b.setAttribute('aria-label',G.paused?'Timer fortsetzen':'Timer pausieren')}break;
    case 'tovote':sfx.tap();haptic(10);goVote();break;
    case 'pick':{
      const i=+t.dataset.i;
      if(G.picks.has(i)){G.picks.delete(i);sfx.select();haptic(8)}
      else if(G.k===1){G.picks=new Set([i]);sfx.select();haptic(10)}
      else if(G.picks.size<G.k){G.picks.add(i);sfx.select();haptic(10)}
      else{toast('Maximal '+G.k+' Personen');sfx.warn();haptic([10,20,10])}
      rVote();break}
    case 'resolve':resolve();break;
    case 'again':sfx.tap();haptic(10);start(false);break;
    case 'edit':sfx.tap();haptic(10);G.phase='setup';render();break;
    case 'btarget':if(e.detail===0){sfx.toggle();haptic(8);bSetTarget(B.target+ +t.dataset.d)}break;   /* Maus/Touch laufen über pointerdown, hier nur Tastatur */
    case 'badd':if(B.players.length>=BMAX)break;sfx.tap();haptic(8);B.players.push('');bSave();bSetup();{const ins=$$('.pf input');ins[ins.length-1].focus()}break;
    case 'brm':sfx.tap();haptic(8);B.players.splice(+t.dataset.i,1);bSave();bSetup();break;
    case 'bstart':sfx.start();haptic([15,40,15]);bBegin(true);break;
    case 'bnext':
      sfx.tap();haptic(10);
      if(B.pidx<B.players.length-1){B.pidx++;bRender()}
      else{B.idx=0;B.phase='turn';bRender()}
      break;
    case 'bgo':if(performance.now()<B.lock)break;sfx.tap();haptic(10);B.phase='cdown';bRender();break;
    case 'bstop':bStop();break;
    case 'bagain':if(performance.now()<B.lock)break;sfx.tap();haptic(10);bBegin(false);break;
    case 'bedit':if(performance.now()<B.lock)break;sfx.tap();haptic(10);B.phase='setup';bRender();break;
    case 'bpick':{const i=+t.dataset.i;B.vote=B.vote===i?-1:i;sfx.select();haptic(10);bVote();break}
    case 'bresolve':if(B.vote<0)break;sfx.tap();haptic(10);bResolve();break;
    case 'wmode':sfx.toggle();haptic(8);wSetMode(+t.dataset.v);break;
    case 'wreroll':wReroll();break;
    case 'wadd':if(W.names.length>=10)break;sfx.tap();haptic(8);W.names.push('');wSave();wSetup();{const ins=$$('.pf input');ins[ins.length-1].focus()}break;
    case 'wrm':sfx.tap();haptic(8);W.names.splice(+t.dataset.i,1);wSave();wSetup();break;
    case 'wstart':sfx.start();haptic([15,40,15]);W.phase='play';wRender();break;
    case 'wspin':wSpin();break;
    case 'wagain':sfx.tap();haptic(10);if(W.pen)wPun();wRender();break;
    case 'wedit':sfx.tap();haptic(10);W.phase='setup';wRender();break;
    case 'cadd':if(C.players.length>=12)break;sfx.tap();haptic(8);C.players.push('');cSetup();{const ins=$$('.pf input');ins[ins.length-1].focus()}break;
    case 'crm':sfx.tap();haptic(8);C.players.splice(+t.dataset.i,1);cSave();cSetup();break;
    case 'ck':sfx.toggle();haptic(8);C.k=+t.dataset.v;$$('[data-act="ck"]').forEach(b=>b.setAttribute('aria-pressed',String(b===t)));cSave();break;
    case 'cstart':sfx.start();haptic([15,40,15]);cStart(true);break;

    case 'cpick':{
      const i=+t.dataset.i;
      if(C.picks.has(i)){C.picks.delete(i);sfx.select();haptic(8)}
      else if(C.k===1){C.picks=new Set([i]);sfx.select();haptic(10)}
      else if(C.picks.size<C.k){C.picks.add(i);sfx.select();haptic(10)}
      else{toast('Maximal '+C.k+' Personen');sfx.warn();haptic([10,20,10])}
      cVote();break}
    case 'cresolve':cResolve();break;
    case 'cagain':sfx.tap();haptic(10);cStart(false);break;
    case 'cedit':sfx.tap();haptic(10);C.phase='setup';cRender();break;
    case 'zstart':ddOpen=false;sfx.start();haptic([15,40,15]);zBegin();break;
    case 'zagain':sfx.start();haptic([15,40,15]);zBegin();break;
    case 'zedit':sfx.tap();haptic(10);Z.phase='setup';zRender();break;
    case 'zddcat':sfx.tap();haptic(8);ddOpen=!ddOpen;syncDD();break;
    case 'zcat':{sfx.toggle();haptic(8);const k=t.dataset.k,on=Z.cats.includes(k);Z.cats=on?Z.cats.filter(x=>x!==k):Z.cats.concat(k);zSyncCats();break}
    case 'zcatall':sfx.toggle();haptic(8);Z.cats=Z.cats.length===Object.keys(BCATS).length?[]:Object.keys(BCATS);zSyncCats();break;
    case 'zspeed':sfx.toggle();haptic(8);Z.speed=+t.dataset.v;zSave();zSetup();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('.pf input')){
    if(t.dataset.b){B.players[+t.dataset.i]=t.value;bSave()}
    else if(t.dataset.w){W.names[+t.dataset.i]=t.value;wSave()}
    else if(t.dataset.c){C.players[+t.dataset.i]=t.value;cSave()}
    else{G.players[+t.dataset.i]=t.value;save()}
  }
  else if(t.id==='srng'){
    const o=$('#sval'),w=$('#slid');
    if(o)o.textContent=fmtN(t.value);
    if(w&&C.q)w.style.setProperty('--p',(100*(t.value-C.q.min)/(C.q.max-C.q.min)).toFixed(2)+'%');
  }
  else if(t.id==='sq')renderSearch(t.value);
  else if(t.id==='pname'){profile.name=t.value.trim();store.set('splash.profile',profile)}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset)return;
  if(t.dataset.act==='hint'){G.hint=t.checked;save()}
  else if(t.dataset.act==='setSound'){
    settings.sound=t.checked;saveSettings();
    const ti=t.closest('.toggle').querySelector('.ti');if(ti)ti.innerHTML=settings.sound?I.speakerOn:I.speakerOff;
    sfx.toggle();haptic(10);
  }
  else if(t.dataset.act==='btime'){sfx.toggle();haptic(8);bSetTarget(+t.value)}
  else if(t.dataset.act==='bimp'){sfx.toggle();haptic(10);bSetImp(t.checked)}
  else if(t.dataset.act==='bhint'){sfx.toggle();haptic(8);B.hint=t.checked;bSave()}
  else if(t.dataset.act==='wpen'){sfx.toggle();haptic(10);wSetPen(t.checked)}
  else if(t.dataset.act==='setHaptic'){
    settings.haptic=t.checked;saveSettings();
    try{settings.haptic&&navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(ddOpen){ddOpen=false;syncDD()}else if($('.modal'))closeModal();else if(settingsEl.classList.contains('open'))closeSettings();else if(searchEl.classList.contains('open'))closeSearch();else if(gameEl.classList.contains('open')&&isSetup())closeGame()}
  if(e.key==='Enter'&&e.target.matches('.pf input,#pname'))e.target.blur();
  if(e.key==='Tab'){                                   /* Fokus im geöffneten Dialog halten */
    const sh=$('.msheet');if(!sh)return;
    const f=$$('button,input,[href]',sh).filter(x=>!x.disabled);if(!f.length)return;
    const a=f[0],z=f[f.length-1],ae=document.activeElement;
    if(!sh.contains(ae)||ae===sh){e.preventDefault();a.focus()}
    else if(e.shiftKey&&ae===a){e.preventDefault();z.focus()}
    else if(!e.shiftKey&&ae===z){e.preventDefault();a.focus()}
  }
});

/* Buzzer: beim Antippen sofort stoppen (pointerdown ist genauer als click) */
document.addEventListener('pointerdown',e=>{
  if(cur!=='buzzer'||B.phase!=='run')return;
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.target.closest('#buzz')){e.preventDefault();bStop(e.timeStamp)}
});

/* Auswahl-Leisten (.seg): Position und Anzahl der Knöpfe für die weiße Fläche mitführen */
function syncSegs(){
  $$('.seg').forEach(sg=>{
    const bs=$$('button',sg),i=bs.findIndex(b=>b.getAttribute('aria-pressed')==='true');
    const n=String(Math.max(1,bs.length)),x=String(Math.max(0,i));
    if(sg.style.getPropertyValue('--n')!==n)sg.style.setProperty('--n',n);
    if(sg.style.getPropertyValue('--i')!==x)sg.style.setProperty('--i',x);
    sg.classList.toggle('none',i<0);
    if(!sg.classList.contains('rdy')&&!sg._q){sg._q=1;requestAnimationFrame(()=>requestAnimationFrame(()=>sg.classList.add('rdy')))}   /* erst nach dem ersten Bild animieren, damit die Fläche beim Öffnen nicht einfliegt */
  });
}
new MutationObserver(syncSegs).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['aria-pressed']});
syncSegs();

renderHome();initCarousel();initScroll();initGameHeroPull();
})();
</script>
